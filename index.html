<!DOCTYPE html>
<html lang="ar"><!-- بدون dir="rtl": اتجاه الصفحة يخرّب أماكن عناصر Flutter (الأزرار وحقول الكتابة)، والتطبيق يدير اتجاهه بنفسه -->
<head>
  <base href="/admin-panel/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="لوحة إدارة HIGHWAY Delivery">
  <meta name="theme-color" content="#26CED0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HW Admin">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>HIGHWAY Admin</title>
  <style>
    /* مساحات الأمان (النوتش وشريط الرجوع) يقرأها التطبيق عبر hwSafe */
    :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
    html, body { margin: 0; height: 100%; background: #FBFAF7; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #hw-load { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; background: #26CED0; z-index: 9; transition: opacity .35s ease; }
    #hw-load img { width: 104px; height: 104px; border-radius: 26px; box-shadow: 0 18px 40px -16px rgba(14,58,59,.55); animation: hwp 1.3s ease-in-out infinite; }
    @keyframes hwp { 50% { transform: scale(.93); opacity: .85; } }
  </style>
  <script>
    window.hwSafe = function () {
      var s = getComputedStyle(document.documentElement);
      return ['--sat', '--sar', '--sab', '--sal'].map(function (k) { return parseFloat(s.getPropertyValue(k)) || 0; }).join(',');
    };
    // المواقع القديمة كانت تخزّن نفسها في الجوال: نزيلها حتى يفتح التطبيق الجديد دائمًا
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    }
    // شاشة التحميل تختفي لما يظهر التطبيق (أول رسمة)، ولا تمنع اللمس أبدًا
    (function () {
      var done = false;
      function hide() {
        if (done) return; done = true;
        var l = document.getElementById('hw-load'); if (!l) return;
        l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      new MutationObserver(function (_, o) {
        if (document.querySelector('flutter-view, flt-glass-pane')) { o.disconnect(); setTimeout(hide, 450); }
      }).observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(hide, 12000);
    })();
  </script>
</head>
<body>
  <div id="hw-load"><img src="icons/icon-192.png" alt=""></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
